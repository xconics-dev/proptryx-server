name: gemini-pr-review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: gemini-pr-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Review PR with Gemini
        uses: actions/github-script@v8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const marker = '<!-- gemini-pr-review -->';
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              core.warning('GEMINI_API_KEY is not configured. Skipping Gemini PR review.');
              return;
            }

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || '(no description)';

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const maxChars = 120000;
            let usedChars = 0;
            const diffBlocks = [];

            for (const file of files) {
              if (!file.patch) {
                continue;
              }

              const block = [
                `File: ${file.filename}`,
                `Status: ${file.status}`,
                'Patch:',
                file.patch,
              ].join('\n');

              if (usedChars + block.length > maxChars) {
                break;
              }

              diffBlocks.push(block);
              usedChars += block.length;
            }

            if (diffBlocks.length === 0) {
              core.info('No textual patch found to review.');
              return;
            }

            const prompt = [
              'You are a strict senior code reviewer.',
              'Review this pull request diff and provide practical, high-signal feedback.',
              'Focus on: bugs, regressions, security, API-contract breaks, race conditions, error handling, and test gaps.',
              'Keep it concise and actionable.',
              '',
              'Output format (Markdown):',
              '1) Summary (2-4 bullets)',
              '2) Findings: use bullets with severity labels [high|medium|low], file path, and fix suggestion',
              '3) Suggested tests (if applicable)',
              '4) Final verdict: approve / request changes',
              '',
              `PR title: ${prTitle}`,
              `PR description: ${prBody}`,
              '',
              'Changed files and patches:',
              diffBlocks.join('\n\n---\n\n'),
            ].join('\n');

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [
                    {
                      role: 'user',
                      parts: [{ text: prompt }],
                    },
                  ],
                  generationConfig: {
                    temperature: 0.2,
                    maxOutputTokens: 1400,
                  },
                }),
              },
            );

            if (!response.ok) {
              const errText = await response.text();
              core.setFailed(`Gemini API request failed (${response.status}): ${errText}`);
              return;
            }

            const data = await response.json();
            const modelText =
              data?.candidates?.[0]?.content?.parts
                ?.map((part) => part?.text || '')
                .join('\n')
                .trim() || 'Gemini returned an empty review.';

            const body = [
              marker,
              '## Gemini PR Review',
              '',
              modelText,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing Gemini review comment (${existing.id}).`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              core.info('Created new Gemini review comment.');
            }
