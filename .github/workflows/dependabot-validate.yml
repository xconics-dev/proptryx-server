name: dependabot-validate

on:
  pull_request:
    branches: ["main"]

jobs:
  validate-dependency-update:
    name: validate-dependency-update
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting and lint
        run: pnpm check

      - name: Validate types
        run: pnpm type-check

      - name: Validate build
        run: pnpm build
