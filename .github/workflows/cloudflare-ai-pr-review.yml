name: cloudflare-ai-pr-review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: cloudflare-ai-pr-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Review PR with Cloudflare Workers AI
        uses: actions/github-script@v8
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
        with:
          script: |
            const marker = '<!-- cloudflare-ai-pr-review -->';
            const accountId = (process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
            const apiToken = (process.env.CLOUDFLARE_API_TOKEN || '').trim();
            const modelRaw = process.env.CLOUDFLARE_AI_MODEL || '@cf/meta/llama-3.1-8b-instruct';
            const model = modelRaw.trim().replace(/^['"]|['"]$/g, '');

            if (!accountId || !apiToken) {
              core.warning('CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is not configured. Skipping Cloudflare AI PR review.');
              return;
            }

            if (!/^[a-f0-9]{32}$/i.test(accountId)) {
              core.setFailed(`Invalid CLOUDFLARE_ACCOUNT_ID format. Expected 32-char hex account id, got length ${accountId.length}.`);
              return;
            }

            if (!model.startsWith('@cf/')) {
              core.setFailed(`Invalid CLOUDFLARE_AI_MODEL: "${model}". Expected a Cloudflare model id like @cf/meta/llama-3.1-8b-instruct`);
              return;
            }

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || '(no description)';

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const maxChars = 120000;
            let usedChars = 0;
            const diffBlocks = [];

            for (const file of files) {
              if (!file.patch) {
                continue;
              }

              const block = [
                `File: ${file.filename}`,
                `Status: ${file.status}`,
                'Patch:',
                file.patch,
              ].join('\n');

              if (usedChars + block.length > maxChars) {
                break;
              }

              diffBlocks.push(block);
              usedChars += block.length;
            }

            if (diffBlocks.length === 0) {
              core.info('No textual patch found to review.');
              return;
            }

            const prompt = [
              'You are a strict senior code reviewer.',
              'Review this pull request diff and provide practical, high-signal feedback.',
              'Focus on: bugs, regressions, security, API-contract breaks, race conditions, error handling, and test gaps.',
              'Keep it concise and actionable.',
              '',
              'Output format (Markdown):',
              '1) Summary (2-4 bullets)',
              '2) Findings: use bullets with severity labels [high|medium|low], file path, and fix suggestion',
              '3) Suggested tests (if applicable)',
              '4) Final verdict: approve / request changes',
              '',
              `PR title: ${prTitle}`,
              `PR description: ${prBody}`,
              '',
              'Changed files and patches:',
              diffBlocks.join('\n\n---\n\n'),
            ].join('\n');

            core.info(`Using Cloudflare model: ${model}`);
            core.info(`Cloudflare account id length: ${accountId.length}`);

            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/ai/run/${model}`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${apiToken}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  prompt,
                  temperature: 0.2,
                  max_tokens: 1400,
                }),
              },
            );

            if (!response.ok) {
              const errText = await response.text();
              core.setFailed(`Cloudflare AI request failed (${response.status}): ${errText}`);
              return;
            }

            const data = await response.json();
            if (!data?.success) {
              core.setFailed(`Cloudflare AI error: ${JSON.stringify(data?.errors || data)}`);
              return;
            }

            const modelText =
              data?.result?.response?.trim() ||
              data?.result?.text?.trim() ||
              'Cloudflare AI returned an empty review.';

            const body = [
              marker,
              `## Cloudflare AI PR Review (${model})`,
              '',
              modelText,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing Cloudflare AI review comment (${existing.id}).`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              core.info('Created new Cloudflare AI review comment.');
            }
