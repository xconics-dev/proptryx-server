x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - app-network

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json

services:
  gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    ports:
      - "3000:3000"
    environment:
      <<: *service-env
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth:3001
      PROPERTY_SERVICE_URL: http://property:3002
    depends_on:
      auth:
        condition: service_healthy
      property:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth
    ports:
      - "3001:3001"
    environment:
      <<: *service-env
      PORT: "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  property:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/property/Dockerfile
    container_name: property
    ports:
      - "3002:3002"
    environment:
      <<: *service-env
      PORT: "3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge
