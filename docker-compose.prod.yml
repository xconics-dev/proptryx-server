x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - app-network

x-service-env: &service-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${PROD_LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS:-false}

services:
  gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:${GATEWAY_PORT:-8000}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.proptryx.rule=Host(`proptryx.devmon.in`)
      - traefik.http.routers.proptryx.entrypoints=websecure
      - traefik.http.routers.proptryx.tls.certresolver=letsencrypt
      - traefik.http.services.proptryx.loadbalancer.server.port=8000
    environment:
      <<: *service-env
      PORT: "${GATEWAY_PORT:-8000}"
      AUTH_SERVICE_URL: http://auth:6001
      PROPERTY_SERVICE_URL: http://property:6002
    depends_on:
      - auth
      - property
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${GATEWAY_PORT:-8000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "${AUTH_HOST_PORT:-6001}:${AUTH_PORT:-6001}"
    networks:
      app-network:
        aliases:
          - auth
    environment:
      <<: *service-env
      PORT: "${AUTH_PORT:-6001}"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${AUTH_PORT:-6001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  property:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/property/Dockerfile
    ports:
      - "${PROPERTY_HOST_PORT:-6002}:${PROPERTY_PORT:-6002}"
    networks:
      app-network:
        aliases:
          - property
    environment:
      <<: *service-env
      PORT: "${PROPERTY_PORT:-6002}"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${PROPERTY_PORT:-6002}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: overlay