x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - app-network

x-service-env: &service-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_HOST_PORT:-7000}:${GATEWAY_PORT:-7000}"
    environment:
      <<: *service-env
      PORT: "${GATEWAY_PORT:-7000}"
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:${AUTH_PORT:-7001}}
      PROPERTY_SERVICE_URL: ${PROPERTY_SERVICE_URL:-http://property:${PROPERTY_PORT:-7002}}
    depends_on:
      auth:
        condition: service_healthy
      property:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${GATEWAY_PORT:-7000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth
    ports:
      - "${AUTH_HOST_PORT:-7001}:${AUTH_PORT:-7001}"
    environment:
      <<: *service-env
      PORT: "${AUTH_PORT:-7001}"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${AUTH_PORT:-7001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  property:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/property/Dockerfile
    container_name: property
    ports:
      - "${PROPERTY_HOST_PORT:-7002}:${PROPERTY_PORT:-7002}"
    environment:
      <<: *service-env
      PORT: "${PROPERTY_PORT:-7002}"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:${PROPERTY_PORT:-7002}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge
