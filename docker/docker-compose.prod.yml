name: proptryx

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging:
    driver: local
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: ${DOCKER_LOG_MAX_FILE:-5}
  networks:
    - app-network

services:
  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:${GATEWAY_PORT:-8000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GATEWAY_PORT: ${GATEWAY_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS:-false}
      NODE_OPTIONS: ${GATEWAY_NODE_OPTIONS:---max-old-space-size=512}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com,https://admin.example.com}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PROPERTY_SERVICE_URL: ${PROPERTY_SERVICE_URL}
    depends_on:
      auth:
        condition: service_healthy
      property:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${GATEWAY_PORT:-8000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  auth:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/auth.Dockerfile
    ports:
      - "${AUTH_HOST_PORT:-6001}:${AUTH_PORT:-6001}"
    networks:
      app-network:
        aliases:
          - auth
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_PORT: ${AUTH_PORT:-6001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS:-false}
      NODE_OPTIONS: ${AUTH_NODE_OPTIONS:---max-old-space-size=768}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com,https://admin.example.com}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${AUTH_PORT:-6001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  property:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/property.Dockerfile
    ports:
      - "${PROPERTY_HOST_PORT:-6002}:${PROPERTY_PORT:-6002}"
    networks:
      app-network:
        aliases:
          - property
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PROPERTY_PORT: ${PROPERTY_PORT:-6002}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS:-false}
      NODE_OPTIONS: ${PROPERTY_NODE_OPTIONS:---max-old-space-size=768}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com,https://admin.example.com}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${PROPERTY_PORT:-6002}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
networks:
  app-network:
    driver: bridge
