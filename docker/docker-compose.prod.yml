name: proptryx

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging:
    driver: local
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE}
      max-file: ${DOCKER_LOG_MAX_FILE}

services:
  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    networks:
      app-network:
        aliases:
          - gateway
    ports:
      - "${GATEWAY_HOST_PORT}:${GATEWAY_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      GATEWAY_PORT: ${GATEWAY_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${GATEWAY_NODE_OPTIONS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      COMPANY_SERVICE_URL: ${COMPANY_SERVICE_URL}
      KERNEL_SERVICE_URL: ${KERNEL_SERVICE_URL}
    depends_on:
      auth:
        condition: service_healthy
      company:
        condition: service_healthy
      kernel:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${GATEWAY_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  auth:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/auth.Dockerfile
    ports:
      - "${AUTH_HOST_PORT}:${AUTH_PORT}"
    networks:
      app-network:
        aliases:
          - auth
          - proptryx-auth
    environment:
      NODE_ENV: ${NODE_ENV}
      AUTH_PORT: ${AUTH_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${AUTH_NODE_OPTIONS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_CROSS_SUBDOMAIN_COOKIES: ${BETTER_AUTH_CROSS_SUBDOMAIN_COOKIES:-false}
      BETTER_AUTH_COOKIE_DOMAIN: ${BETTER_AUTH_COOKIE_DOMAIN:-}
      BETTER_AUTH_COOKIE_SAME_SITE: ${BETTER_AUTH_COOKIE_SAME_SITE:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GST_API_KEY: ${GST_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${AUTH_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  kernel:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/kernel.Dockerfile
    ports:
      - "${KERNEL_HOST_PORT}:${KERNEL_PORT}"
    networks:
      app-network:
        aliases:
          - kernel
          - proptryx-kernel
    environment:
      NODE_ENV: ${NODE_ENV}
      KERNEL_PORT: ${KERNEL_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${KERNEL_NODE_OPTIONS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GST_API_KEY: ${GST_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${KERNEL_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  company:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/company.Dockerfile
    ports:
      - "${COMPANY_HOST_PORT}:${COMPANY_PORT}"
    networks:
      app-network:
        aliases:
          - company
          - proptryx-company
    environment:
      NODE_ENV: ${NODE_ENV}
      COMPANY_PORT: ${COMPANY_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${COMPANY_NODE_OPTIONS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${COMPANY_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
networks:
  app-network:
    name: proptryx-app-network
    driver: bridge
