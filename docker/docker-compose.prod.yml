name: proptryx

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging:
    driver: local
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE}
      max-file: ${DOCKER_LOG_MAX_FILE}

services:
  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    networks:
      app-network:
        aliases:
          - gateway
    ports:
      - "${GATEWAY_HOST_PORT}:${GATEWAY_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      GATEWAY_PORT: ${GATEWAY_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${GATEWAY_NODE_OPTIONS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PROPERTY_SERVICE_URL: ${PROPERTY_SERVICE_URL}
    depends_on:
      auth:
        condition: service_healthy
      property:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${GATEWAY_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  auth:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/auth.Dockerfile
    ports:
      - "${AUTH_HOST_PORT}:${AUTH_PORT}"
    networks:
      app-network:
        aliases:
          - auth
          - proptryx-auth
    environment:
      NODE_ENV: ${NODE_ENV}
      AUTH_PORT: ${AUTH_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${AUTH_NODE_OPTIONS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${AUTH_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  property:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/property.Dockerfile
    ports:
      - "${PROPERTY_HOST_PORT}:${PROPERTY_PORT}"
    networks:
      app-network:
        aliases:
          - property
          - proptryx-property
    environment:
      NODE_ENV: ${NODE_ENV}
      PROPERTY_PORT: ${PROPERTY_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${PROPERTY_NODE_OPTIONS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${PROPERTY_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
networks:
  app-network:
    name: proptryx-app-network
    driver: bridge
