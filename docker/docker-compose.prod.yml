x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging:
    driver: local
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: ${DOCKER_LOG_MAX_FILE:-5}
  networks:
    - app-network

x-deploy-defaults: &deploy-defaults
  restart_policy:
    condition: on-failure
  update_config:
    order: start-first
    parallelism: 1
    failure_action: rollback
  rollback_config:
    order: stop-first
    parallelism: 1

services:
  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "${GATEWAY_HOST_PORT}:${GATEWAY_PORT}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.proptryx.rule=Host(`${TRAEFIK_GATEWAY_HOST}`)
      - traefik.http.routers.proptryx.entrypoints=websecure
      - traefik.http.routers.proptryx.tls.certresolver=letsencrypt
      - traefik.http.services.proptryx.loadbalancer.server.port=${GATEWAY_PORT}
    environment:
      NODE_ENV: ${GATEWAY_NODE_ENV}
      PORT: ${GATEWAY_PORT}
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL}
      LOG_FORMAT: ${GATEWAY_LOG_FORMAT}
      LOG_HEALTHCHECKS: ${GATEWAY_LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${GATEWAY_NODE_OPTIONS}
      AUTH_SERVICE_URL: http://auth:${AUTH_PORT}
      PROPERTY_SERVICE_URL: http://property:${PROPERTY_PORT}
    depends_on:
      auth:
        condition: service_healthy
      property:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${GATEWAY_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      <<: *deploy-defaults
      replicas: ${GATEWAY_REPLICAS:-2}
      resources:
        limits:
          cpus: "${GATEWAY_CPU_LIMIT:-1.00}"
          memory: ${GATEWAY_MEM_LIMIT:-768M}
        reservations:
          cpus: "${GATEWAY_CPU_RESERVATION:-0.25}"
          memory: ${GATEWAY_MEM_RESERVATION:-256M}

  auth:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/auth.Dockerfile
    ports:
      - "${AUTH_HOST_PORT}:${AUTH_PORT}"
    networks:
      app-network:
        aliases:
          - auth
    environment:
      NODE_ENV: ${AUTH_NODE_ENV}
      PORT: ${AUTH_PORT}
      LOG_LEVEL: ${AUTH_LOG_LEVEL}
      LOG_FORMAT: ${AUTH_LOG_FORMAT}
      LOG_HEALTHCHECKS: ${AUTH_LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${AUTH_NODE_OPTIONS}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${AUTH_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      <<: *deploy-defaults
      replicas: ${AUTH_REPLICAS:-3}
      resources:
        limits:
          cpus: "${AUTH_CPU_LIMIT:-1.50}"
          memory: ${AUTH_MEM_LIMIT:-1024M}
        reservations:
          cpus: "${AUTH_CPU_RESERVATION:-0.30}"
          memory: ${AUTH_MEM_RESERVATION:-256M}

  property:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/property.Dockerfile
    ports:
      - "${PROPERTY_HOST_PORT}:${PROPERTY_PORT}"
    networks:
      app-network:
        aliases:
          - property
    environment:
      NODE_ENV: ${PROPERTY_NODE_ENV}
      PORT: ${PROPERTY_PORT}
      LOG_LEVEL: ${PROPERTY_LOG_LEVEL}
      LOG_FORMAT: ${PROPERTY_LOG_FORMAT}
      LOG_HEALTHCHECKS: ${PROPERTY_LOG_HEALTHCHECKS}
      NODE_OPTIONS: ${PROPERTY_NODE_OPTIONS}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${PROPERTY_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      <<: *deploy-defaults
      replicas: ${PROPERTY_REPLICAS:-3}
      resources:
        limits:
          cpus: "${PROPERTY_CPU_LIMIT:-1.50}"
          memory: ${PROPERTY_MEM_LIMIT:-1024M}
        reservations:
          cpus: "${PROPERTY_CPU_RESERVATION:-0.30}"
          memory: ${PROPERTY_MEM_RESERVATION:-256M}

networks:
  app-network:
    driver: bridge
