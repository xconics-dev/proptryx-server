name: proptryx

x-service-defaults: &service-defaults
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging:
    driver: local
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
      max-file: ${DOCKER_LOG_MAX_FILE:-5}
  networks:
    - app-network

x-deploy-defaults: &deploy-defaults
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 5
    window: 120s
  update_config:
    order: start-first
    parallelism: 1
    delay: 10s
    failure_action: rollback
  rollback_config:
    order: stop-first
    parallelism: 1

services:
  gateway:
    <<: *service-defaults
    image: ${GATEWAY_IMAGE}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GATEWAY_PORT: ${GATEWAY_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS:-false}
      NODE_OPTIONS: ${GATEWAY_NODE_OPTIONS:---max-old-space-size=512}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com,https://admin.example.com}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      PROPERTY_SERVICE_URL: ${PROPERTY_SERVICE_URL}
    ports:
      - target: ${GATEWAY_PORT:-8000}
        published: ${GATEWAY_HOST_PORT:-8000}
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:${GATEWAY_PORT:-8000}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy-defaults
      mode: replicated
      replicas: ${GATEWAY_REPLICAS:-2}
      resources:
        limits:
          cpus: "${GATEWAY_CPU_LIMIT:-1.00}"
          memory: ${GATEWAY_MEM_LIMIT:-768M}
        reservations:
          cpus: "${GATEWAY_CPU_RESERVATION:-0.25}"
          memory: ${GATEWAY_MEM_RESERVATION:-256M}
      labels:
        - traefik.enable=true
        - traefik.docker.network=app-network
        - traefik.http.routers.proptryx.rule=Host(`${TRAEFIK_GATEWAY_HOST:-api.example.com}`)
        - traefik.http.routers.proptryx.entrypoints=websecure
        - traefik.http.routers.proptryx.tls=true
        - traefik.http.routers.proptryx.tls.certresolver=letsencrypt
        - traefik.http.services.proptryx.loadbalancer.server.port=${GATEWAY_PORT:-8000}

  auth:
    <<: *service-defaults
    image: ${AUTH_IMAGE}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_PORT: ${AUTH_PORT:-6001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS:-false}
      NODE_OPTIONS: ${AUTH_NODE_OPTIONS:---max-old-space-size=768}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com,https://admin.example.com}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY}
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:${AUTH_PORT:-6001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy-defaults
      mode: replicated
      replicas: ${AUTH_REPLICAS:-3}
      resources:
        limits:
          cpus: "${AUTH_CPU_LIMIT:-1.50}"
          memory: ${AUTH_MEM_LIMIT:-1024M}
        reservations:
          cpus: "${AUTH_CPU_RESERVATION:-0.30}"
          memory: ${AUTH_MEM_RESERVATION:-256M}

  property:
    <<: *service-defaults
    image: ${PROPERTY_IMAGE}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PROPERTY_PORT: ${PROPERTY_PORT:-6002}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_HEALTHCHECKS: ${LOG_HEALTHCHECKS:-false}
      NODE_OPTIONS: ${PROPERTY_NODE_OPTIONS:---max-old-space-size=768}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.example.com,https://admin.example.com}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:${PROPERTY_PORT:-6002}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      <<: *deploy-defaults
      mode: replicated
      replicas: ${PROPERTY_REPLICAS:-3}
      resources:
        limits:
          cpus: "${PROPERTY_CPU_LIMIT:-1.50}"
          memory: ${PROPERTY_MEM_LIMIT:-1024M}
        reservations:
          cpus: "${PROPERTY_CPU_RESERVATION:-0.30}"
          memory: ${PROPERTY_MEM_RESERVATION:-256M}

networks:
  app-network:
    driver: overlay
    attachable: true
