x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - app-network

services:
  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_HOST_PORT}:${GATEWAY_PORT}"
    environment:
      NODE_ENV: ${GATEWAY_NODE_ENV}
      PORT: ${GATEWAY_PORT}
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL}
      LOG_FORMAT: ${GATEWAY_LOG_FORMAT}
      LOG_HEALTHCHECKS: ${GATEWAY_LOG_HEALTHCHECKS}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SERVICE_URL: http://auth:${AUTH_PORT}
      PROPERTY_SERVICE_URL: http://property:${PROPERTY_PORT}
    depends_on:
      auth:
        condition: service_healthy
      property:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${GATEWAY_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/auth.Dockerfile
    container_name: auth
    ports:
      - "${AUTH_HOST_PORT}:${AUTH_PORT}"
    environment:
      NODE_ENV: ${AUTH_NODE_ENV}
      PORT: ${AUTH_PORT}
      LOG_LEVEL: ${AUTH_LOG_LEVEL}
      LOG_FORMAT: ${AUTH_LOG_FORMAT}
      LOG_HEALTHCHECKS: ${AUTH_LOG_HEALTHCHECKS}
      DATABASE_URL: ${DATABASE_URL}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${AUTH_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  property:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: docker/property.Dockerfile
    container_name: property
    ports:
      - "${PROPERTY_HOST_PORT}:${PROPERTY_PORT}"
    environment:
      NODE_ENV: ${PROPERTY_NODE_ENV}
      PORT: ${PROPERTY_PORT}
      LOG_LEVEL: ${PROPERTY_LOG_LEVEL}
      LOG_FORMAT: ${PROPERTY_LOG_FORMAT}
      LOG_HEALTHCHECKS: ${PROPERTY_LOG_HEALTHCHECKS}
      DATABASE_URL: ${DATABASE_URL}
    healthcheck:
      test:
        ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:${PROPERTY_PORT}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge
